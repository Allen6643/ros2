# 水下 ROV 仿真与神经网络控制参数
# ================================
# 由 main.launch.py 与 main.py 读取，集中管理便于复现场景。

# ---------------- 物理仿真 ----------------
sim_rate: 500.0              # 物理步进频率 Hz
publish_rate: 50.0           # 话题发布频率 Hz
buoyancy_compensate: true    # 中性浮力补偿（抵消整机重力，使 ROV 可悬停）

# 推力/力矩标定值（由 tools 标定实验确定，整机质量 13.15 kg）
#   推力 10 N  约对应 2 秒前进 1.5 m（平均 0.75 m/s），适合通道内巡航
#   若把 force_scale 设为 320（早期版本），ROV 会瞬间冲到通道尽头
force_scale: 10.0            # 归一化推力 -> 牛顿
torque_scale: 2.0            # 归一化偏航力矩 -> 牛米

# ---------------- 初始状态 ----------------
target_depth: -1.0           # 期望巡航深度（米，向下为负）
initial_position: [0.0, 0.0, -1.0]

# ---------------- 前视相机 ----------------
camera_width: 160
camera_height: 120
camera_name: forward_cam
publish_camera_every: 5      # 每 N 次发布发一帧图像（降低 CPU 软件渲染压力）

# ---------------- 神经网络 ----------------
data_samples: 4000           # 数据集采样条数
train_epochs: 50             # 训练轮数
train_batch_size: 128
train_lr: 0.001
val_ratio: 0.2
random_seed: 42

# ---------------- 轨迹跟踪任务 ----------------
traj_forward_step: 0.8       # 期望点每步前进距离（米）
traj_target_y: 0.0           # 通道中线
traj_x_max: 6.5              # 终点位置（米）
