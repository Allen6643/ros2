# rov_e2e 多场景测试配置
# =======================
# 对应作业要求「所有任务均在仿真环境下完成，推荐使用多个场景进行测试，且包含性能评价」。
# 用法见 docs/water/rov_e2e.md 的「多场景测试与性能评价」一节。
#
# 每个场景给出：环境条件（是否静水）、初始状态（深度/艏向）与随机种子。
# 通过 main.launch.py / main.py 的对应参数注入，保证同一场景可复现。

# 默认场景（静水、初始艏向朝正前方），采集与训练均使用该场景
default: S1_still_water_shallow

scenarios:

  - name: S1_still_water_shallow
    description: 静水、浅水起始深度，基准场景
    ocean_current: false
    target_depth: -1.0          # 目标深度（米，Z 轴向下为负）
    initial_yaw_deg: 0.0        # 初始艏向偏角
    max_forward: 1.0            # 前进推力上限
    max_turn: 1.0               # 转向上限
    seed: 1

  - name: S2_still_water_deep
    description: 静水、较深起始深度，考察深度控制与视觉变化
    ocean_current: false
    target_depth: -3.0
    initial_yaw_deg: 0.0
    max_forward: 1.0
    max_turn: 1.0
    seed: 2

  - name: S3_yaw_offset_left
    description: 静水、初始艏向左偏 15°，考察网络的纠偏能力
    ocean_current: false
    target_depth: -1.0
    initial_yaw_deg: 15.0
    max_forward: 1.0
    max_turn: 1.0
    seed: 3

  - name: S4_yaw_offset_right
    description: 静水、初始艏向右偏 15°，与 S3 对称
    ocean_current: false
    target_depth: -1.0
    initial_yaw_deg: -15.0
    max_forward: 1.0
    max_turn: 1.0
    seed: 4

  - name: S5_mild_current
    description: 轻度洋流扰动（约 0.3 m/s），考察抗流鲁棒性
    ocean_current: true
    ocean_current_speed: 0.3
    target_depth: -1.5
    initial_yaw_deg: 0.0
    max_forward: 1.0
    max_turn: 1.0
    seed: 5

  - name: S6_strong_current
    description: 较强洋流扰动（约 0.8 m/s），压力测试
    ocean_current: true
    ocean_current_speed: 0.8
    target_depth: -2.0
    initial_yaw_deg: 0.0
    max_forward: 1.0
    max_turn: 1.0
    seed: 6
